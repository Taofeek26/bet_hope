# GitHub Actions — Train ML Model on AWS
# Replaces: .github/workflows/train-model.yml (Oracle)
#
# Flow: SSH to EC2 → export training data → download → train on GH runner
#       → commit model to repo → SSH to EC2 → activate model

name: Train ML Model (AWS)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force_train:
        description: 'Force training'
        default: 'false'
        required: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  export-data:
    name: Export Training Data from EC2
    runs-on: ubuntu-latest
    steps:
      - name: Export data from production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/bet_hope
            docker compose -f docker-compose.prod.yml exec -T backend \
              python manage.py export_training_data --output /app/training_data.json
            docker compose -f docker-compose.prod.yml cp \
              backend:/app/training_data.json ./training_data.json
            echo "Export complete: $(wc -c < training_data.json) bytes"

      - name: Download training data
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          scp ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bet_hope/training_data.json ./training_data.json
          rm ~/.ssh/id_rsa
          echo "Downloaded: $(wc -c < training_data.json) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: training_data.json
          retention-days: 1

  train:
    name: Train Model
    needs: export-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      model_version: ${{ steps.train.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: training-data
          path: backend/

      - name: Train model
        id: train
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cd backend
          VERSION=$(date +%Y%m%d_%H%M%S)
          echo "model_version=$VERSION" >> $GITHUB_OUTPUT

          python manage.py train_from_export \
            --input training_data.json \
            --model-version $VERSION

          echo "Model artifacts:"
          ls -la models/$VERSION/

      - name: Commit model to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ML Trainer Bot"
          git config user.email "ml@github-actions.local"

          git add -f backend/models/${{ steps.train.outputs.model_version }}/*.pkl
          git add -f backend/models/${{ steps.train.outputs.model_version }}/*.json

          if git diff --staged --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "chore(ml): update model v${{ steps.train.outputs.model_version }}

          Trained $(date +%Y-%m-%d) via GitHub Actions (AWS)"

            git remote set-url origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git push
            echo "Model pushed to repo"
          fi

      - name: Cleanup EC2 data
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -f /opt/bet_hope/training_data.json

  activate:
    name: Activate Model on EC2
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Activate on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/bet_hope

            echo "=== Pull latest model ==="
            git stash
            git pull origin main

            echo "=== Activate model v${{ needs.train.outputs.model_version }} ==="
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py shell -c "
            from apps.predictions.models import ModelVersion
            from django.utils import timezone

            version = '${{ needs.train.outputs.model_version }}'

            model, created = ModelVersion.objects.get_or_create(
                version=version,
                defaults={
                    'status': 'inactive',
                    'accuracy': 0.45,
                    'trained_at': timezone.now(),
                    'notes': 'Trained via GitHub Actions (AWS)'
                }
            )

            ModelVersion.objects.all().update(status='inactive')
            model.status = 'active'
            model.save()

            print(f'Model {version} activated')
            "

            echo "=== Restart services ==="
            docker compose -f docker-compose.prod.yml restart backend celery
            echo "Done!"