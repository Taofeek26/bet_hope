# GitHub Actions — Deploy Bet_Hope to AWS EC2
# Replaces: .github/workflows/deploy.yml (Oracle)
#
# Before using:
#   1. Add GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, GHCR_TOKEN
#   2. Verify the EC2 is running and Docker is installed
#   3. On first deploy, manually run "Build and Deploy" from Actions tab

name: Build and Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/taofeek26/bet-hope-backend
  FRONTEND_IMAGE: ghcr.io/taofeek26/bet-hope-frontend

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          $SSH "set -e
            cd /opt/bet_hope

            echo '=== Stop services ==='
            free -h
            docker compose -f docker-compose.prod.yml stop backend celery celery-beat frontend nginx || true
            docker system prune -f || true

            echo '=== Pull new images ==='
            docker pull ghcr.io/taofeek26/bet-hope-backend:latest
            docker pull ghcr.io/taofeek26/bet-hope-frontend:latest

            echo '=== Fix env ==='
            grep -q ALLOWED_HOSTS backend/.env.prod || echo DJANGO_ALLOWED_HOSTS=* >> backend/.env.prod

            echo '=== Start services ==='
            docker compose -f docker-compose.prod.yml up -d
            sleep 15

            echo '=== Migrate & collectstatic ==='
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput

            echo '=== Restart nginx ==='
            docker compose -f docker-compose.prod.yml restart nginx
            sleep 5

            echo '=== Verify ==='
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost/health/ && echo 'HEALTH OK' || echo 'HEALTH FAIL'

            echo '=== Cleanup ==='
            docker image prune -f
            free -h
          "