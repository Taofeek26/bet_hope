AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Bet_Hope Minimal Deployment - EC2 (t4g.small) + Docker Compose.
  No RDS. No ElastiCache. No ALB. No NAT Gateway.
  ~$22/mo on-demand. Free-tier eligible (first 12 months).
  Deploy: sam build && sam deploy --guided

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair for SSH access

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.small]

  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 200

  GitHubRepo:
    Type: String
    Default: Taofeek26/bet_hope

  DomainName:
    Type: String
    Default: ""

  HostedZoneId:
    Type: String
    Default: ""

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >
      Postgres password, shared by the EC2 Docker Compose stack and the
      VPC-attached ML Lambda. Pass with --parameter-overrides at deploy
      time — do not let `sam deploy --guided` save this into a committed
      samconfig.toml.

  TasksApiKey:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Shared secret required (as an X-Api-Key header) to call the
      /tasks/* Lambda endpoints, which are otherwise unauthenticated on
      the public internet. Generate with e.g. `openssl rand -hex 32`.

  LambdaVpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC the ML Lambda (train/predict/export) will run in, so it can
      reach Postgres on the EC2 instance privately without a NAT Gateway.
      Use the same VPC your EC2 instance launches into (your account's
      default VPC unless you changed it).

  LambdaSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Any subnet within LambdaVpcId for the ML Lambda's ENI.

  LambdaRouteTableId:
    Type: String
    AllowedPattern: ^rtb-[a-f0-9]+$
    Description: >
      Route table ID (e.g. rtb-xxxxxxxx) associated with LambdaSubnetId —
      used to attach a free S3 Gateway VPC Endpoint so the VPC-attached
      Lambda can still reach the model S3 bucket without a NAT Gateway.
      (Not AWS::EC2::RouteTable::Id — CloudFormation has no such
      SSM-backed parameter type.)

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bet_Hope public app - SSH HTTP HTTPS
      GroupName: !Sub ${AWS::StackName}-sg
      VpcId: !Ref LambdaVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StaticBucket.Arn
                  - !Sub ${StaticBucket.Arn}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-profile
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex
          exec > /var/log/user-data.log 2>&1
          apt-get update -y
          apt-get install -y curl git unzip ca-certificates
          curl -fsSL https://get.docker.com | sh
          usermod -aG docker ubuntu
          # get.docker.com's script already installs docker-compose-plugin
          # (provides `docker compose`) — a separate `apt-get install
          # docker-compose-v2` here conflicts with it (same file, different
          # package) and halts this script under set -ex before anything
          # past this line runs.
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          mkdir -p /opt/bet_hope
          chown ubuntu:ubuntu /opt/bet_hope
          su - ubuntu -c "git clone https://github.com/${GitHubRepo}.git /opt/bet_hope || (cd /opt/bet_hope && git stash && git pull origin main)"
          cat > /opt/bet_hope/backend/.env.prod << 'EOF'
          DJANGO_SECRET_KEY=CHANGE_ME
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=*
          DB_PASSWORD=${DBPassword}
          OPENAI_API_KEY=
          API_FOOTBALL_KEY=
          FOOTBALL_DATA_ORG_KEY=
          SENTRY_DSN=
          EOF
          chown ubuntu:ubuntu /opt/bet_hope/backend/.env.prod
          echo "Setup complete. Public IP: $(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2

  EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-eip

  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-static-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-static

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*

  DNSRecord:
    Condition: HasDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref EIP

# ==========================================================================
  # LAMBDA FUNCTIONS — ML tasks (cost: ~$0.50/mo total)
  # ==========================================================================
  # NOTE: train/predict/export are NOT deployed here. The full ML stack
  # (numpy+pandas+scikit-learn+scipy+xgboost) is ~350MB unzipped on its
  # own — over Lambda's 250MB unzipped zip/layer limit even before adding
  # Django. That combination needs a container-image Lambda (up to 10GB)
  # instead, which needs Docker to build — see docs/AWS_MINIMAL_DEPLOYMENT.md
  # for the follow-up. In the meantime, training/prediction still run on
  # EC2 via Celery beat (config/celery.py), so the app works without this.
  # LambdaVpcId/LambdaSubnetId/LambdaRouteTableId params are kept, unused,
  # for that follow-up (LambdaVpcId is also used by SecurityGroup below).

  # Handles /tasks/sync only. Deliberately NOT VPC-attached — sync_real_data
  # needs real internet access (API-Football, Football-Data.org), which a
  # NAT-less VPC Lambda can't reach. Instead of connecting to Postgres
  # itself, it dispatches the sync command to the EC2 box via SSM (free,
  # instance already has AmazonSSMManagedInstanceCore), where Django has a
  # local DB connection and the instance's own internet access.
  SyncDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-sync-dispatcher-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SSMDispatchToInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  SyncDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-sync-dispatcher
      Handler: handler.handler
      Runtime: python3.13
      CodeUri: ../backend/lambda-sync/
      MemorySize: 256
      Timeout: 600
      Role: !GetAtt SyncDispatcherRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref Instance
          TASKS_API_KEY: !Ref TasksApiKey
      Events:
        SyncData:
          Type: HttpApi
          Properties:
            Path: /tasks/sync
            Method: POST
            ApiId: !Ref HttpApi
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref HttpApi

  # ==========================================================================
  # HTTP API (API Gateway v2 — $1/million requests, cheaper than REST)
  # ==========================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["*"]

  # ==========================================================================
  # S3 — ML model storage
  # ==========================================================================
  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-models-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-models

Outputs:
  PublicIP:
    Description: EC2 public IP
    Value: !Ref EIP
  SSH:
    Description: SSH command
    Value: !Sub "ssh -i ${KeyPairName}.pem ubuntu@${EIP}"
  AppURL:
    Description: App URL
    Value: !Sub "http://${EIP}/"
  S3Bucket:
    Description: S3 bucket
    Value: !Ref StaticBucket
  LambdaURL:
    Description: Lambda API endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ModelBucket:
    Description: S3 bucket for ML models
    Value: !Ref ModelBucket