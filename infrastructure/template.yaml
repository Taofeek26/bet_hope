AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Bet_Hope Fully Serverless Deployment — Lambda (container image, Django
  via apig-wsgi) + API Gateway REST + RDS Postgres + NAT Gateway.
  Replaces the earlier EC2/Docker Compose approach. Real monthly cost
  (~$50-70/mo: RDS db.t4g.micro + NAT Gateway + Lambda + API Gateway) —
  a deliberate tradeoff, not the cheapest possible option; see
  docs/AWS_COST_ESTIMATOR.md for the comparison against the EC2 approach.
  Deploy: sam build && sam deploy --guided

Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the Django Lambda (built by
      .github/workflows/deploy-lambda-web.yml). Must exist before this
      stack can create/update the Lambda functions.

  DBUsername:
    Type: String
    Default: bet_hope

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: RDS Postgres password. Pass with --parameter-overrides, never --guided-saved.

  DjangoSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Django SECRET_KEY for production. Generate with `openssl rand -hex 32`.

  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated exact origins allowed to call the API (e.g. your Vercel URL).

  CorsAllowedOriginRegexes:
    Type: String
    Default: ""
    Description: Comma-separated regexes for dynamic origins (e.g. Vercel preview URLs).

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ""

  ApiFootballKey:
    Type: String
    NoEcho: true
    Default: ""

  FootballDataOrgKey:
    Type: String
    NoEcho: true
    Default: ""

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  # ==========================================================================
  # NETWORKING — dedicated VPC (not the account default) so we control
  # exactly which subnets are public (IGW) vs private (NAT), since Lambda
  # needs both RDS access (private) and internet access (via NAT) at once.
  # ==========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # NAT Gateway + its EIP are NOT declared here as static resources. They're
  # created/destroyed daily by InfraToggleFunction (see below) on a
  # 5am-5pm WAT schedule to avoid paying for them 12 hours/day — a NAT
  # Gateway has no "stop" state, only create/delete, so CloudFormation
  # can't own something a schedule needs to tear down out-of-band without
  # drifting. PrivateRoute (the 0.0.0.0/0 -> NAT route) is likewise managed
  # by that function, not declared statically here.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Django Lambda functions - egress only
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Postgres - only from Lambda
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rds-sg

  # ==========================================================================
  # DATABASE
  # ==========================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.11"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: bet_hope
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-db

  # ==========================================================================
  # S3 — static/media + ML model storage
  # ==========================================================================
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-static-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-static

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*

  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-models-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-models

  # ==========================================================================
  # LAMBDA — Django web (API Gateway REST proxy) + management commands
  # ==========================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StaticBucket.Arn
                  - !Sub ${StaticBucket.Arn}/*
                  - !GetAtt ModelBucket.Arn
                  - !Sub ${ModelBucket.Arn}/*
        # Lets WebFunction (the Django/API Gateway side) kick off ManageFunction
        # asynchronously for the UI-triggered task runner — see
        # apps/api/views/tasks.py. Both functions share this role, so this also
        # grants ManageFunction self-invoke, which it never actually calls.
        # ARN is built by naming convention (not !GetAtt ManageFunction.Arn)
        # because both functions use this same role — a GetAtt here would
        # create Role -> ManageFunction -> Role, a circular dependency CFN
        # rejects outright.
        - PolicyName: InvokeManageFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-manage

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-web
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["lambda_web_handler.handler"]
      MemorySize: 1024
      Timeout: 29
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: !Ref DjangoSecretKey
          DJANGO_ALLOWED_HOSTS: "*"
          DATABASE_URL: !Sub postgres://${DBUsername}:${DBPassword}@${DBInstance.Endpoint.Address}:5432/bet_hope
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_ORIGIN_REGEXES: !Ref CorsAllowedOriginRegexes
          S3_MODEL_BUCKET: !Ref ModelBucket
          OPENAI_API_KEY: !Ref OpenAIApiKey
          API_FOOTBALL_KEY: !Ref ApiFootballKey
          FOOTBALL_DATA_ORG_KEY: !Ref FootballDataOrgKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          DEFAULT_AI_PROVIDER: openai
          MANAGE_FUNCTION_NAME: !Ref ManageFunction
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY

  # Runs migrate/sync_real_data/train_model/generate_predictions/
  # export_training_data/sync_injuries/generate_news_signals — same image
  # as WebFunction, invoked directly (aws lambda invoke) or via the
  # EventBridge rules below, never through API Gateway. Longer timeout
  # since training can take a while; not on the 29s API Gateway clock.
  ManageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-manage
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["lambda_manage_handler.handler"]
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: !Ref DjangoSecretKey
          DJANGO_ALLOWED_HOSTS: "*"
          DATABASE_URL: !Sub postgres://${DBUsername}:${DBPassword}@${DBInstance.Endpoint.Address}:5432/bet_hope
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_ORIGIN_REGEXES: !Ref CorsAllowedOriginRegexes
          S3_MODEL_BUCKET: !Ref ModelBucket
          OPENAI_API_KEY: !Ref OpenAIApiKey
          API_FOOTBALL_KEY: !Ref ApiFootballKey
          FOOTBALL_DATA_ORG_KEY: !Ref FootballDataOrgKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          DEFAULT_AI_PROVIDER: openai

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

  # ==========================================================================
  # SCHEDULED JOBS — replaces Celery beat (no broker in this architecture)
  # All fixed cron times below are UTC and deliberately fall inside the
  # 04:00-16:00 UTC (5am-5pm WAT) window that InfraToggleFunction keeps
  # NAT Gateway + RDS up for — anything scheduled outside that window would
  # just fail with the database unreachable.
  # ==========================================================================
  SyncDataSchedule:
    Type: AWS::Events::Rule
    Properties:
      # --fixtures-only, not --fixtures: the latter also re-syncs the ENTIRE
      # historical dataset (all 20 leagues x every available season) before
      # touching fixtures at all, which alone blows the 850s budget —
      # confirmed timing out on this schedule every single day since it was
      # deployed. Historical results don't change day to day, so there's
      # nothing to gain from redoing that daily; only fixtures need it.
      Description: Daily upcoming-fixture sync, 04:15 UTC — after startup, before training
      ScheduleExpression: cron(15 4 * * ? *)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: SyncData
          Input: '{"command": "sync_real_data", "args": ["--fixtures-only"]}'

  SyncDataPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SyncDataSchedule.Arn

  TrainModelSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily model retraining, 05:00 UTC (6am WAT)
      ScheduleExpression: cron(0 5 * * ? *)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: TrainModel
          Input: '{"command": "train_model", "args": []}'

  TrainModelPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrainModelSchedule.Arn

  GeneratePredictionsSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Refresh predictions daily, 05:15 UTC — right after training
      ScheduleExpression: cron(15 5 * * ? *)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: GeneratePredictions
          Input: '{"command": "generate_predictions", "args": []}'

  GeneratePredictionsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GeneratePredictionsSchedule.Arn

  # ==========================================================================
  # INFRA TOGGLE — brings NAT Gateway + RDS up at 5am WAT and tears them
  # down at 5pm WAT. A NAT Gateway has no stop/start state (only
  # create/delete), so this can't be a CloudFormation-owned resource that
  # a schedule also mutates out-of-band without drifting — it's created
  # fresh every morning and deleted every evening entirely through this
  # function, using PrivateRouteTable (still CFN-owned) as the one shared
  # handle between the two. Runs outside the VPC (it's calling the EC2/RDS
  # control plane, not the app).
  # ==========================================================================
  InfraToggleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ToggleNatAndRds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # NAT Gateway/EIP/route actions don't support resource-level
              # ARN scoping in IAM — "*" is the actual AWS-imposed floor here,
              # not a shortcut taken for convenience.
              - Effect: Allow
                Action:
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:DescribeAddresses
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:DescribeNatGateways
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ReplaceRoute
                  - ec2:DescribeRouteTables
                  - ec2:CreateTags
                Resource: "*"
              - Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                  - rds:DescribeDBInstances
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${DBInstance}

  InfraToggleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-infra-toggle
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 128
      Timeout: 600
      Role: !GetAtt InfraToggleRole.Arn
      Environment:
        Variables:
          PUBLIC_SUBNET_ID: !Ref PublicSubnet1
          PRIVATE_ROUTE_TABLE_ID: !Ref PrivateRouteTable
          DB_INSTANCE_ID: !Ref DBInstance
          NAT_NAME_TAG: !Sub ${AWS::StackName}-nat
      InlineCode: |
        import os
        import boto3
        from botocore.exceptions import ClientError

        ec2 = boto3.client('ec2')
        rds = boto3.client('rds')

        PUBLIC_SUBNET_ID = os.environ['PUBLIC_SUBNET_ID']
        PRIVATE_ROUTE_TABLE_ID = os.environ['PRIVATE_ROUTE_TABLE_ID']
        DB_INSTANCE_ID = os.environ['DB_INSTANCE_ID']
        NAT_NAME_TAG = os.environ['NAT_NAME_TAG']


        def handler(event, context):
            action = event.get('action')
            if action == 'start':
                return start()
            if action == 'stop':
                return stop()
            raise ValueError(f'Unknown action: {action!r} (expected "start" or "stop")')


        def start():
            try:
                rds.start_db_instance(DBInstanceIdentifier=DB_INSTANCE_ID)
                rds_result = 'starting'
            except rds.exceptions.InvalidDBInstanceStateFault:
                rds_result = 'already running/starting'

            eip = ec2.allocate_address(
                Domain='vpc',
                TagSpecifications=[{'ResourceType': 'elastic-ip', 'Tags': [{'Key': 'Name', 'Value': NAT_NAME_TAG}]}],
            )
            nat = ec2.create_nat_gateway(
                SubnetId=PUBLIC_SUBNET_ID,
                AllocationId=eip['AllocationId'],
                TagSpecifications=[{'ResourceType': 'natgateway', 'Tags': [{'Key': 'Name', 'Value': NAT_NAME_TAG}]}],
            )
            nat_id = nat['NatGateway']['NatGatewayId']

            waiter = ec2.get_waiter('nat_gateway_available')
            waiter.wait(NatGatewayIds=[nat_id], WaiterConfig={'Delay': 10, 'MaxAttempts': 40})

            try:
                ec2.delete_route(RouteTableId=PRIVATE_ROUTE_TABLE_ID, DestinationCidrBlock='0.0.0.0/0')
            except ClientError:
                pass
            ec2.create_route(
                RouteTableId=PRIVATE_ROUTE_TABLE_ID,
                DestinationCidrBlock='0.0.0.0/0',
                NatGatewayId=nat_id,
            )

            return {'status': 'started', 'nat_gateway_id': nat_id, 'rds': rds_result}


        def stop():
            try:
                rds.stop_db_instance(DBInstanceIdentifier=DB_INSTANCE_ID)
                rds_result = 'stopping'
            except rds.exceptions.InvalidDBInstanceStateFault:
                rds_result = 'already stopped/stopping'

            nats = ec2.describe_nat_gateways(Filters=[
                {'Name': 'subnet-id', 'Values': [PUBLIC_SUBNET_ID]},
                {'Name': 'state', 'Values': ['available']},
            ])['NatGateways']

            deleted = []
            for nat in nats:
                nat_id = nat['NatGatewayId']
                alloc_ids = [a['AllocationId'] for a in nat.get('NatGatewayAddresses', []) if 'AllocationId' in a]

                try:
                    ec2.delete_route(RouteTableId=PRIVATE_ROUTE_TABLE_ID, DestinationCidrBlock='0.0.0.0/0')
                except ClientError:
                    pass

                ec2.delete_nat_gateway(NatGatewayId=nat_id)
                waiter = ec2.get_waiter('nat_gateway_deleted')
                waiter.wait(NatGatewayIds=[nat_id], WaiterConfig={'Delay': 10, 'MaxAttempts': 40})

                for alloc_id in alloc_ids:
                    try:
                        ec2.release_address(AllocationId=alloc_id)
                    except ClientError:
                        pass

                deleted.append(nat_id)

            return {'status': 'stopped', 'nat_gateways_deleted': deleted, 'rds': rds_result}

  InfraStartSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Bring up NAT Gateway + RDS, 04:00 UTC (5am WAT)
      ScheduleExpression: cron(0 4 * * ? *)
      Targets:
        - Arn: !GetAtt InfraToggleFunction.Arn
          Id: InfraStart
          Input: '{"action": "start"}'

  InfraStartPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InfraToggleFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt InfraStartSchedule.Arn

  InfraStopSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Tear down NAT Gateway + stop RDS, 16:00 UTC (5pm WAT)
      ScheduleExpression: cron(0 16 * * ? *)
      Targets:
        - Arn: !GetAtt InfraToggleFunction.Arn
          Id: InfraStop
          Input: '{"action": "stop"}'

  InfraStopPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InfraToggleFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt InfraStopSchedule.Arn

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  DBEndpoint:
    Description: RDS endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
  StaticBucket:
    Value: !Ref StaticBucket
  ModelBucket:
    Value: !Ref ModelBucket
  ManageFunctionName:
    Description: Invoke with `aws lambda invoke --function-name <this> --payload '{"command":"migrate"}' out.json`
    Value: !Ref ManageFunction
