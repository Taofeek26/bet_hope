AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Bet_Hope Fully Serverless Deployment — Lambda (container image, Django
  via apig-wsgi) + API Gateway REST + RDS Postgres + NAT Gateway.
  Replaces the earlier EC2/Docker Compose approach. Real monthly cost
  (~$50-70/mo: RDS db.t4g.micro + NAT Gateway + Lambda + API Gateway) —
  a deliberate tradeoff, not the cheapest possible option; see
  docs/AWS_COST_ESTIMATOR.md for the comparison against the EC2 approach.
  Deploy: sam build && sam deploy --guided

Parameters:
  ImageUri:
    Type: String
    Description: >
      ECR image URI for the Django Lambda (built by
      .github/workflows/deploy-lambda-web.yml). Must exist before this
      stack can create/update the Lambda functions.

  DBUsername:
    Type: String
    Default: bet_hope

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: RDS Postgres password. Pass with --parameter-overrides, never --guided-saved.

  DjangoSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Django SECRET_KEY for production. Generate with `openssl rand -hex 32`.

  CorsAllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated exact origins allowed to call the API (e.g. your Vercel URL).

  CorsAllowedOriginRegexes:
    Type: String
    Default: ""
    Description: Comma-separated regexes for dynamic origins (e.g. Vercel preview URLs).

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ""

  ApiFootballKey:
    Type: String
    NoEcho: true
    Default: ""

  FootballDataOrgKey:
    Type: String
    NoEcho: true
    Default: ""

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  # ==========================================================================
  # NETWORKING — dedicated VPC (not the account default) so we control
  # exactly which subnets are public (IGW) vs private (NAT), since Lambda
  # needs both RDS access (private) and internet access (via NAT) at once.
  # ==========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # Single NAT Gateway (not one per AZ) — the standard cost-saving choice
  # for a low-traffic app; ~$32/mo either way, doubling it for HA isn't
  # worth it here.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Django Lambda functions - egress only
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Postgres - only from Lambda
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rds-sg

  # ==========================================================================
  # DATABASE
  # ==========================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.11"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: bet_hope
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-db

  # ==========================================================================
  # S3 — static/media + ML model storage
  # ==========================================================================
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-static-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-static

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*

  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-models-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-models

  # ==========================================================================
  # LAMBDA — Django web (API Gateway REST proxy) + management commands
  # ==========================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StaticBucket.Arn
                  - !Sub ${StaticBucket.Arn}/*
                  - !GetAtt ModelBucket.Arn
                  - !Sub ${ModelBucket.Arn}/*

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-web
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["lambda_web_handler.handler"]
      MemorySize: 1024
      Timeout: 29
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: !Ref DjangoSecretKey
          DJANGO_ALLOWED_HOSTS: "*"
          DATABASE_URL: !Sub postgres://${DBUsername}:${DBPassword}@${DBInstance.Endpoint.Address}:5432/bet_hope
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_ORIGIN_REGEXES: !Ref CorsAllowedOriginRegexes
          S3_MODEL_BUCKET: !Ref ModelBucket
          OPENAI_API_KEY: !Ref OpenAIApiKey
          API_FOOTBALL_KEY: !Ref ApiFootballKey
          FOOTBALL_DATA_ORG_KEY: !Ref FootballDataOrgKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          DEFAULT_AI_PROVIDER: openai
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /{proxy+}
            Method: ANY

  # Runs migrate/sync_real_data/train_model/generate_predictions/
  # export_training_data/sync_injuries/generate_news_signals — same image
  # as WebFunction, invoked directly (aws lambda invoke) or via the
  # EventBridge rules below, never through API Gateway. Longer timeout
  # since training can take a while; not on the 29s API Gateway clock.
  ManageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-manage
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["lambda_manage_handler.handler"]
      MemorySize: 2048
      Timeout: 900
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: !Ref DjangoSecretKey
          DJANGO_ALLOWED_HOSTS: "*"
          DATABASE_URL: !Sub postgres://${DBUsername}:${DBPassword}@${DBInstance.Endpoint.Address}:5432/bet_hope
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          CORS_ALLOWED_ORIGIN_REGEXES: !Ref CorsAllowedOriginRegexes
          S3_MODEL_BUCKET: !Ref ModelBucket
          OPENAI_API_KEY: !Ref OpenAIApiKey
          API_FOOTBALL_KEY: !Ref ApiFootballKey
          FOOTBALL_DATA_ORG_KEY: !Ref FootballDataOrgKey
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          DEFAULT_AI_PROVIDER: openai

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

  # ==========================================================================
  # SCHEDULED JOBS — replaces Celery beat (no broker in this architecture)
  # ==========================================================================
  SyncDataSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily data sync (fixtures/results)
      ScheduleExpression: rate(1 day)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: SyncData
          Input: '{"command": "sync_real_data", "args": ["--fixtures"]}'

  SyncDataPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SyncDataSchedule.Arn

  TrainModelSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Nightly model retraining, 5am UTC
      ScheduleExpression: cron(0 5 * * ? *)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: TrainModel
          Input: '{"command": "train_model", "args": []}'

  TrainModelPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrainModelSchedule.Arn

  GeneratePredictionsSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Refresh predictions every 6 hours
      ScheduleExpression: rate(6 hours)
      Targets:
        - Arn: !GetAtt ManageFunction.Arn
          Id: GeneratePredictions
          Input: '{"command": "generate_predictions", "args": []}'

  GeneratePredictionsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GeneratePredictionsSchedule.Arn

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  DBEndpoint:
    Description: RDS endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
  StaticBucket:
    Value: !Ref StaticBucket
  ModelBucket:
    Value: !Ref ModelBucket
  ManageFunctionName:
    Description: Invoke with `aws lambda invoke --function-name <this> --payload '{"command":"migrate"}' out.json`
    Value: !Ref ManageFunction
